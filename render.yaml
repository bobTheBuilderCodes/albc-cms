services:
  - type: web
    name: albc-cms-server
    runtime: node
    branch: mvp
    rootDir: server
    buildCommand: npm install --include=dev && npm run build && cd ../client && npm install --include=dev && npm run build
    startCommand: node -e "const req=['MONGO_URI','JWT_SECRET']; const miss=req.filter((k)=>!process.env[k]); if(miss.length){console.error('Missing required env vars:', miss.join(', ')); process.exit(1)}" && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: albc-cms
    runtime: static
    branch: mvp
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://albc-cms-server.onrender.com/api
      - key: VITE_API_BASE_URL
        value: https://albc-cms-server.onrender.com/api
